# Local dev services. `mise run db:up`, then in mise.local.toml:
#   BUGSMITH_DATABASE_URL = "postgresql+psycopg://bugsmith:bugsmith@localhost:5432/bugsmith"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bugsmith
      POSTGRES_PASSWORD: bugsmith
      POSTGRES_DB: bugsmith
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsmith"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
