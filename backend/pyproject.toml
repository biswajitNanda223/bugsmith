[project]
name = "bugsmith"
version = "0.1.0"
description = "AI debugging agent: production crash -> root cause -> validated fix -> draft PR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.39,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
claude = ["google-adk[extensions]>=1.39,<2"]  # LiteLLM, to run agents on Claude: BUGSMITH_MODEL=anthropic/<model>

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "bugsmith_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
